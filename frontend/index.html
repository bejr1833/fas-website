    <script>
      (function () {
        try {
          var saved = localStorage.getItem("fas-theme");
          var dark = saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (error) {}
      })();
    </script>
