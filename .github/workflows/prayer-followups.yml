name: FAS Prayer Email Follow-ups

on:
  schedule:
    - cron: "*/5 * * * *" # retry acknowledgments and send follow-ups due after 24 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fas-prayer-email-dispatch
  cancel-in-progress: false

jobs:
  send-prayer-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger private FAS prayer email dispatcher
        env:
          FAS_FOLLOWUP_TOKEN: ${{ secrets.FAS_FOLLOWUP_TOKEN }}
        run: |
          set -euo pipefail
          FAS_FOLLOWUP_URL="https://fas-backend-xnhy.onrender.com/api/internal/send-prayer-followups/"
          FAS_FOLLOWUP_TOKEN="$(printf '%s' "$FAS_FOLLOWUP_TOKEN" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$FAS_FOLLOWUP_TOKEN" ]; then
            echo "Required repository secret FAS_FOLLOWUP_TOKEN is missing." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $FAS_FOLLOWUP_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$FAS_FOLLOWUP_URL"
